<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>qostua</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#07070d;
color:white;
}

.canvas-container {
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

#bg {
z-index:1;
}

#bg-front {
z-index:3;
pointer-events:none;
}

.card{
position:relative;
z-index:2;
width:90%;
max-width:480px;
padding:80px 45px;
border-radius:40px;
background:rgba(255,255,255,0.025);
backdrop-filter:blur(60px);
border:1px solid rgba(255,255,255,0.15);
box-shadow: 
    0 0 30px rgba(255,120,200,0.15),
    inset 0 0 30px rgba(255,255,255,0.1),
    0 0 0 1px rgba(255,120,200,0.1) inset,
    0 0 20px rgba(0,0,0,0.3);
text-align:center;
transform-style:preserve-3d;
transition:transform 0.2s ease, box-shadow 1.2s ease;
opacity:0;
animation:fadeIn 2s forwards;
}

.card:hover {
    box-shadow: 
        0 0 50px rgba(255,120,200,0.3),
        inset 0 0 40px rgba(255,255,255,0.15),
        0 0 0 2px rgba(255,120,200,0.2) inset,
        0 0 30px rgba(0,0,0,0.4);
}

@keyframes fadeIn{
to{opacity:1;}
}

.name{
font-size:36px;
font-weight:600;
margin-bottom:30px;
letter-spacing:1px;
text-shadow:0 0 25px rgba(255,120,200,0.6);
transition:text-shadow 1.2s ease;
}

.text{
font-size:18px;
line-height:1.9;
opacity:0.9;
min-height:140px;
text-shadow:0 0 10px rgba(0,0,0,0.5);
}

.name, .text {
    backdrop-filter:blur(1px);
}

.flash{
position:fixed;
inset:0;
background:white;
opacity:0;
pointer-events:none;
transition:opacity 1s ease;
z-index:4;
}
</style>
</head>

<body>

<div class="canvas-container">
<canvas id="bg"></canvas>
<canvas id="bg-front"></canvas>
</div>

<div class="card" id="card">
<div class="name" id="name">qostua</div>
<div class="text" id="text"></div>
</div>

<div class="flash" id="flash"></div>

<script>
const canvas = document.getElementById("bg");
const canvasFront = document.getElementById("bg-front");
const ctx = canvas.getContext("2d");
const ctxFront = canvasFront.getContext("2d");

function resizeCanvases() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvasFront.width = window.innerWidth;
    canvasFront.height = window.innerHeight;
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

let particles = [];
let particlesFront = [];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2 + 0.5,
dx:(Math.random()-0.5)*0.2,
dy:(Math.random()-0.5)*0.2,
opacity:0.3 + Math.random()*0.4
});
}

for(let i=0;i<60;i++){
particlesFront.push({
x:Math.random()*canvasFront.width,
y:Math.random()*canvasFront.height,
r:Math.random()*2.5 + 0.8,
dx:(Math.random()-0.5)*0.4,
dy:(Math.random()-0.5)*0.4,
opacity:0.6 + Math.random()*0.4
});
}

function drawParticles(ctx, particlesArray) {
    particlesArray.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
    
    ctx.fillStyle = `rgba(255,120,200,${p.opacity})`;
    
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    });
}

function animate(){
    ctx.fillStyle="rgba(7,7,13,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    ctxFront.clearRect(0,0,canvasFront.width,canvasFront.height);
    
    drawParticles(ctx, particles);
    drawParticles(ctxFront, particlesFront);
    
    requestAnimationFrame(animate);
}
animate();

const textEl=document.getElementById("text");
const message = "\n\nWith you, everything works right.\n\nI love you";

let i=0;

function type(){
if(i<message.length){
if (message[i] === "\n") {
textEl.innerHTML += "<br>";
} else {
textEl.innerHTML += message[i];
}
i++;
setTimeout(type,40);
}
}
setTimeout(type,1000);

const card=document.getElementById("card");

window.addEventListener("deviceorientation",function(e){
if (e.gamma && e.beta) {
let x = Math.min(Math.max(e.gamma / 25, -10), 10);
let y = Math.min(Math.max(e.beta / 25, -10), 10);
card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
}
});

const flash=document.getElementById("flash");
const nameEl=document.getElementById("name");

let pressTimer;

function startPress() {
pressTimer=setTimeout(()=>{
flash.style.opacity="1";
card.style.boxShadow="0 0 120px rgba(255,120,200,0.9), inset 0 0 60px rgba(255,255,255,0.3), 0 0 0 3px rgba(255,120,200,0.3) inset";
nameEl.style.textShadow="0 0 60px rgba(255,120,200,1)";
setTimeout(()=>flash.style.opacity="0",1000);
},3000);
}

function endPress() {
clearTimeout(pressTimer);
}

document.body.addEventListener("touchstart", startPress);
document.body.addEventListener("touchend", endPress);
document.body.addEventListener("mousedown", startPress);
document.body.addEventListener("mouseup", endPress);
document.body.addEventListener("mouseleave", endPress);

setTimeout(() => {
nameEl.style.textShadow="0 0 35px rgba(255,120,200,0.8)";
}, 500);
</script>

</body>
</html>
